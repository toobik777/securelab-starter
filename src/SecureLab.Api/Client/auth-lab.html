<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЛР 03 — автентифікація</title>
<link rel="stylesheet" href="auth-lab.css">
</head>
<body>
<h1>Навчальний сеанс SecureLab</h1>
<p>Стан сеансу: <span id="state" data-state="unknown">Перевірка…</span></p>

<fieldset>
  <legend>Реєстрація</legend>
  <form id="register" autocomplete="off">
    <label>Ім’я користувача <input name="userName" autocomplete="username" required minlength="3" maxlength="64"></label>
    <label>Email <input name="email" type="email" autocomplete="email" required maxlength="256"></label>
    <label>Відображуване ім’я <input name="displayName" required maxlength="120"></label>
    <label>Пароль <input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128"></label>
    <button>Зареєструватися</button>
  </form>
</fieldset>

<fieldset>
  <legend>Вхід</legend>
  <form id="login">
    <label>Ім’я <input name="userName" autocomplete="username" required></label>
    <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
    <button>Увійти</button>
  </form>
  <button id="me" type="button">Мій профіль</button>
  <button id="logout" type="button">Вийти</button>
</fieldset>

<fieldset>
  <legend>Профіль (лише з /api/me)</legend>
  <pre id="profile">—</pre>
</fieldset>

<fieldset>
  <legend>Новий інцидент (власник визначається сервером)</legend>
  <form id="incident">
    <label>Заголовок <input name="title" required maxlength="160"></label>
    <label>Опис <textarea name="description" rows="3" required maxlength="4000"></textarea></label>
    <label>Серйозність
      <select name="severity"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
    </label>
    <label>Час події <input name="occurredAt" type="datetime-local" required></label>
    <button>Створити</button>
  </form>
  <pre id="created">—</pre>
</fieldset>

<pre id="result"></pre>
<script src="auth-lab.js" defer></script>
</body>
</html>
